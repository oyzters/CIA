<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root{
    /* oscuro (default) */
    --bg:#0f1217; --surface:#171b22; --surface2:#1e232c; --ink:#f3f5f8; --ink2:#c7cdd8;
    --muted:#8b939f; --line:rgba(255,255,255,.09); --brand:#5b9dff; --brand2:#8bbaff; --brand-deep:#2f6fe0;
    --knob:#c7cdd8; --glow:rgba(91,157,255,.14);
    --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#eef1f6; --surface:#ffffff; --surface2:#eef2f8; --ink:#14213c; --ink2:#33415f;
    --muted:#66728d; --line:#e3e8f2; --brand:#2f5bea; --brand2:#3f6ff0; --brand-deep:#1e3fb0;
    --knob:#ffffff; --glow:rgba(47,91,234,.08);
  }
  *{box-sizing:border-box}
  body{ margin:0; width:290px; font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(90% 60% at 50% -10%, var(--glow), transparent 70%),
      var(--bg);
    -webkit-font-smoothing:antialiased; }

  .hd{ display:flex; align-items:center; gap:11px; padding:18px 18px 14px; }
  .mk{ width:40px; height:40px; border-radius:12px; flex:0 0 auto; display:grid; place-items:center; color:#fff;
    background:linear-gradient(150deg,#78a8ff,var(--brand-deep)); box-shadow:0 8px 18px -6px var(--brand); }
  .mk svg{ width:23px; height:23px; }
  .hd h1{ margin:0; font-size:15.5px; font-weight:700; letter-spacing:-.01em; line-height:1.1; }
  .hd p{ margin:2px 0 0; font-size:11.5px; color:var(--muted); }

  .card{ margin:0 14px 12px; background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .item{ display:flex; align-items:center; gap:12px; padding:13px 14px; }
  .item + .item{ border-top:1px solid var(--line); }
  .item .lbl{ flex:1; min-width:0; }
  .item .lbl b{ display:block; font-size:13px; font-weight:600; }
  .item .lbl span{ font-size:11px; color:var(--muted); }

  /* switch */
  .sw{ width:44px; height:26px; border-radius:20px; background:var(--surface2); border:1px solid var(--line);
    position:relative; cursor:pointer; flex:0 0 auto; transition:background .16s, border-color .16s; }
  .sw::after{ content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:var(--knob); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s cubic-bezier(.3,1.3,.5,1), background .16s; }
  .sw[aria-checked="true"]{ background:linear-gradient(180deg,var(--brand),var(--brand-deep)); border-color:transparent; }
  .sw[aria-checked="true"]::after{ transform:translateX(18px); background:#fff; }

  /* segmented (tema) */
  .seg{ display:flex; gap:3px; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .seg button{ border:none; background:none; cursor:pointer; color:var(--muted); font:inherit; font-size:12px; font-weight:600;
    padding:5px 12px; border-radius:7px; display:flex; align-items:center; gap:6px; transition:background .14s, color .14s; }
  .seg button svg{ width:14px; height:14px; }
  .seg button.on{ background:var(--brand); color:#fff; box-shadow:0 4px 10px -4px var(--brand); }

  .note{ display:flex; gap:9px; margin:0 14px 12px; padding:11px 13px; border:none; border-radius:14px;
    background:color-mix(in srgb, var(--brand) 12%, var(--surface)); }
  .note svg{ width:16px; height:16px; color:var(--brand2); flex:0 0 auto; margin-top:1px; }
  .note p{ margin:0; font-size:11px; color:var(--ink2); line-height:1.5; }

  .foot{ display:flex; align-items:center; gap:14px; padding:6px 18px 16px; }
  .foot a{ color:var(--muted); font-size:11.5px; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
  .foot a:hover{ color:var(--ink); }
  .foot a svg{ width:13px; height:13px; }
  .foot .sp{ flex:1; }
  .foot .ver{ font-size:10.5px; color:var(--muted); opacity:.7; }
</style>
</head>
<body>
  <div class="hd">
    <div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5"/></svg></div>
    <div><h1>CIA Wrap</h1><p>Interfaz moderna para el portal ITSON</p></div>
  </div>

  <div class="card">
    <div class="item">
      <div class="lbl"><b>Interfaz</b><span id="st">Activada</span></div>
      <div id="sw" class="sw" role="switch" aria-checked="true" tabindex="0"></div>
    </div>
    <div class="item">
      <div class="lbl"><b>Tema</b><span>Claro u oscuro</span></div>
      <div class="seg">
        <button data-theme="dark" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Oscuro</button>
        <button data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>Claro</button>
      </div>
    </div>
  </div>

  <div class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    <p>Corre en tu propia sesión. No envía datos ni maneja tu contraseña.</p>
  </div>

  <div class="foot">
    <a href="https://github.com/oyzters/CIA-Wrap" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.6 2 12.3c0 4.5 2.9 8.3 6.8 9.7.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.4-3.4-1.4-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.3-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10.3 10.3 0 0 0 22 12.3C22 6.6 17.5 2 12 2z"/></svg>GitHub</a>
    <span class="sp"></span>
    <span class="ver">v0.1 · Oyzters</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
